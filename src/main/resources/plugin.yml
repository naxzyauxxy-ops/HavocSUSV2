name: HavocSus
version: '${project.version}'
main: com.havocsus.HavocSusPlugin
api-version: '1.21'
author: HavocSus
description: Leashed spectator escort - staff who teleport to a flagged player via SUS get locked into a vanished spectator bubble around them.
# Matching the exact versions DonutPunishments already declares, so these are
# almost certainly cached in the server's libraries/ folder already and no new
# download is needed at startup.
libraries:
  - org.xerial:sqlite-jdbc:3.46.0.0
  - com.mysql:mysql-connector-j:8.4.0

softdepend:
  - Sus
  - DonutPunishments
  - PremiumVanish

commands:
  havocsus:
    description: Manage escort sessions.
    usage: /havocsus <menu|list|quit|status|diag|radius|reload>
    aliases:
      - hs

permissions:
  havocsus.use:
    description: Allows being placed into an escort session and using /havocsus quit|status.
    default: op
  havocsus.admin:
    description: Allows /havocsus reload and /havocsus radius.
    default: op
    children:
      havocsus.use: true
  havocsus.alerts:
    description: Receives anti-cheat alert lines in chat.
    default: op
  havocsus.exempt:
    description: Cannot be watched or spectated by staff.
    default: false
  havocsus.hidefromlist:
    description: Hides this player from the /sus watch list.
    default: false
  havocsus.punish:
    description: Allows opening the punish screen with a second /sus.
    default: op
  havocsus.bypass:
    description: Never gets placed into an escort session at all.
    default: false
  havocsus.bypass.leash:
    description: Escorted, but not distance-limited.
    default: false
  havocsus.bypass.commands:
    description: May run blocked commands while escorting.
    default: false
  havocsus.bypass.vanish:
    description: May un-vanish during an escort. Off by default on purpose.
    default: false
