    - "mouse tweaks|ban|7d"
    - "crafting mods|ban|7d"
    - "baritone|ban|14d"
    - "bug abuse|ban|30d"
    - "duping|ban|"
    - "lag machine|ban|30d"
    - "server crashing|ban|"
    - "seed abuse|ban|30d"
    - "irl trading|ban|"
    - "cross server trading|ban|30d"
    - "external gambling|ban|30d"
    - "invite rewards|ban|14d"
    - "nitro rewards|ban|14d"
