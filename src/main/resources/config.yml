double-sneak:
  enabled: true
  # Max milliseconds between the two shifts.
  window-ms: 350
  # What "solid" mode means. SURVIVAL, ADVENTURE or CREATIVE.
  survival-gamemode: SURVIVAL
  # Give flight in solid mode (staff are vanished anyway).
  allow-flight: false
  # Leaving spectator never moves you. If you drop out of spectator in mid-air
  # this hovers you in place instead of letting you fall.
  hover-if-airborne: true

restrictions:
  # Stop staff using the spectator menu to jump to *other* players.
  # This is the big one - without it spectator mode is a free map tour.
  block-spectate-other-entities: true
  # Block any teleport that would land outside the leash radius.
  block-external-teleports: true
  # Break and place are blocked outright, in BOTH spectator and solid mode.
  block-block-changes: true
  # Also block hitting, looting, dropping and container access in solid mode.
  block-interactions-in-active-mode: true
  # Block opening or clicking in ANOTHER player's inventory during a session -
  # the /invsee and /openinv case. Applies in both modes, since the whole point
  # is that staff investigate without touching the suspect's items.
  block-player-inventories: true
  # Block picking up dropped items during a session.
  block-item-pickup: true
  # Block gamemode changes from other plugins during a session.
  lock-gamemode: true

  # HARD DENY. Refused even for holders of havocsus.bypass.commands.
  # The whitelist below already refuses these - this is the second lock, so a
  # staffer with the bypass permission still can't drop vanish mid-escort.
  always-denied-commands:
    - v
    - vanish
    - pv
    - premiumvanish
    - unvanish
    - vanishtoggle
    - vis
    - invisible

  # Clears the sidebar during a session, which hides PremiumVanish's vanish
  # scoreboard (its ScoreboardOptions). PV redraws on its own interval, so this
  # is reapplied every tick.
  #
  # It clears whatever is in the SIDEBAR slot, not only PV's - if you run
  # another sidebar plugin, staff lose it while escorting. The permanent fix is
  # ScoreboardOptions.Enable: false in PremiumVanish's own config.
  hide-vanish-scoreboard: true

  # Cancels any attempt to UN-VANISH during a session, whatever triggers it -
  # PremiumVanish's hotbar toggle item, a staff GUI, another plugin calling the
  # API. Commands aren't the only way to become visible, so blocking /v alone
  # leaves a hole. Bypass permission: havocsus.bypass.vanish.
  lock-vanish: true

  # WHITELIST. Any command not on this list is refused while escorting.
  # (Bypass permission: havocsus.bypass.commands)
  #
  #   havocsus / escort / hs are listed so staff can always run
  #   `/hs quit` and get out. Delete them if you want them gone too -
  #   just know that leaves double-shift and disconnecting as the only exits.
  allowed-commands:
    - punish
    - offend
    - ban
    - unban
    - kick
    - mute
    - unmute
    - checkban
    - checkmute
    - banhistory
    - banlist
    - unpunish
    - donutpunishments
    - mutehistory
    - alts
    - sus
    - suspicious
    - havocsus
    - hs

sounds:
  enabled: true
  engage: BLOCK_BEACON_ACTIVATE
  release: BLOCK_BEACON_DEACTIVATE
  toggle: UI_BUTTON_CLICK
  wall: BLOCK_NOTE_BLOCK_BASS

