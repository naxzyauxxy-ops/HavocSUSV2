# ---------------------------------------------------------------------------
#  HavocSus
#  Click a flagged player in the SUS GUI -> you get teleported (by SUS) ->
#  HavocSus takes over: vanished spectator, leashed to that player.
# ---------------------------------------------------------------------------

engage:
  # Put staff in spectator the moment SUS teleports them to a flagged player.
  spectator-on-teleport: true
  # Vanish staff via PremiumVanish on engage (and un-vanish on exit, unless
  # they were already vanished before the session started).
  auto-vanish: true
  # Send staff back to where they were standing when the session ends.
  restore-location-on-exit: true
  # How long (ticks) after a SUS GUI click we still treat an incoming teleport
  # as "that click". SUS teleports asynchronously, so leave some slack.
  detect-window-ticks: 60
  # Un-vanish staff when they join.
  #
  # PremiumVanish remembers vanish across sessions, so without this a staffer
  # who logged out mid-escort comes back invisible with no session running and
  # no obvious way to tell.
  unvanish-on-join: true
  # Delay in ticks, so this lands after PremiumVanish has restored its state.
  unvanish-on-join-delay-ticks: 20
  # SUS 1.0.7+ split the GUI click: LEFT-click teleports, RIGHT-click dismisses
  # the flag without moving you. Leave this true so dismissing a flag doesn't
  # arm an escort. Set false only if you're on SUS 1.0.5 or older, where every
  # click teleported.
  ignore-right-click: true

leash:
  # Hard limit, in blocks, from the flagged player.
  radius: 150
  # Start nagging at this distance.
  warn-at: 140
  # Push staff back to the boundary if they somehow end up outside it
  # (e.g. the flagged player sprinted away, or a teleport slipped through).
  pull-back: true
  # Live distance/mode readout on the action bar.
  action-bar: true
  # If the flagged player changes world, drag staff along instead of ending.
  follow-world-change: true

watch-list:
  # OFF by default, on purpose. havocsus.hidefromlist is an opt-OUT node, so any
  # admin with a wildcard ("*" or "havocsus.*" in LuckPerms) matches it and
  # disappears from every list - which looks like "nobody is online" on a server
  # full of staff. Only turn this on if you've actually set the node up.
  respect-hide-permission: false

elytra:
  # A gliding suspect outruns anything on foot, and the leash would just
  # rubber-band you. When the target takes off, snap to them and attach
  # spectator POV - you see exactly what they see, which is also the best angle
  # for judging flight cheats. Detaching manually (shift) is respected; the next
  # takeoff re-attaches.
  follow: true
  # Switch to spectator automatically if you're in solid mode when they take off.
  force-spectator: true

alerts:
  # Reads alert counts and per-check breakdowns from SUS's own database
  # (plugins/Sus/flags.db by default), read-only. SUS has no API, but its SQL
  # column names survive obfuscation, which makes this far more durable than
  # reflecting into its classes.
  enabled: true
  # How often to refresh the cache, in seconds. All queries run off the main
  # thread; dialogs only ever read the cache.
  refresh-seconds: 10
  # Sort the watch list worst-offender-first instead of alphabetically.
  sort-watch-list-by-alerts: true
  # How many players the Top alerts board holds.
  top-limit: 60
  # Leave blank to auto-detect. MySQL setups usually prefix tables with sus_.
  table-prefix: ""

  # LIVE CAPTURE - the primary source of check data.
  #
  # Each anti-cheat fires its own Bukkit event when it flags someone. They share
  # no interface and most are paid, so HavocSus hooks them reflectively from the
  # descriptions below rather than compiling against them.
  #
  # Anything not installed is skipped silently. Run /hs diag to see exactly
  # which ones bound - it prints one line per source.
  #
  # `player`, `check` and `violation` are comma-separated method names, tried in
  # order until one works, so a version difference usually just needs another
  # name adding here. No rebuild required: edit, then /hs reload.
  #
  # NOTE: the class names below are best-effort. Verify with /hs diag; a source
  # that reports "not installed" while that anti-cheat IS running means the class
  # name needs correcting for your version.
  sources:
    grim:
      enabled: true
      event: "ac.grim.grimac.api.events.FlagEvent"
      player: "getPlayer,getUser"
      check: "getCheck,getCheckName"
      violation: "getViolations,getViolation,getVl"
    vulcan:
      enabled: true
      event: "me.frep.vulcan.api.event.VulcanFlagEvent"
      player: "getPlayer"
      check: "getCheck,getCheckName,getType"
      violation: "getVl,getViolations"
    matrix:
      enabled: true
      event: "me.rerere.matrix.api.events.PlayerViolationEvent"
      player: "getPlayer"
      check: "getHackType,getCheck"
      violation: "getViolations,getVl"
    spartan:
      enabled: true
      event: "me.vagdedes.spartan.api.PlayerViolationEvent"
      player: "getPlayer"
      check: "getHackType,getCheck"
      violation: "getViolationLevel,getVl"
    totemguard:
      enabled: true
      event: "com.deathmotion.totemguard.api.events.FlagEvent"
      player: "getPlayer"
      check: "getCheck,getCheckName"
      violation: "getViolations,getVl"
    themis:
      enabled: true
      event: "ltd.matrixstudios.themis.api.event.ThemisFlagEvent"
      player: "getPlayer"
      check: "getCheck,getCheckName"
      violation: "getVl,getViolations"
    boar:
      enabled: true
      event: "org.boar.api.event.BoarFlagEvent"
      player: "getPlayer"
      check: "getCheck,getCheckName"
      violation: "getVl,getViolations"
    polar:
      enabled: true
      event: "top.polar.api.event.PlayerViolationEvent"
      player: "getPlayer,getUser"
      check: "getCheck,getCheckName"
      violation: "getVl,getViolations"

sus-command:
  # Makes `/sus <online player>` teleport you straight to them and start a
  # watch session, instead of opening that player's history GUI.
  #
  # SUS's own /sus <player> does NOT teleport - it opens a history menu - so
  # without this the only way to reach someone is /sus, then click their head.
  #
  # Left alone entirely:
  #   /sus                  the normal SUS GUI (clicking a head still works)
  #   /sus reload | clear    SUS admin commands
  #   /sus <offline name>    SUS's history GUI, so lookups keep working
  direct-teleport: true
  # If NO other plugin provides /sus, HavocSus registers it itself, so the
  # command always exists. Checked at enable time - if SUS is installed it
  # keeps /sus and we only intercept, never steal it.
  #   /sus            opens the watch list (dialog screen on 1.21.7+)
  #   /sus <player>   teleports straight to them and starts watching
  register-if-absent: true
  # Arguments that must always fall through to SUS untouched.
  passthrough-args:
    - reload
    - clear
    - help
    - history

punish:
  # Running /sus again while you're already watching someone opens the punish
  # screen for them instead of the watch list.
  #
  # Reasons are read live from DonutPunishments' own plugins/DonutPunishments/
  # messages.yml (the `reasons:` block), so whatever you configure there shows
  # up here - no duplicate list to keep in sync.
  enabled: true
  # The command each button runs. Dispatched AS the staff member, so their
  # permissions apply and the punishment is attributed to them.
  command: "punish %player% %reason%"
  # Run as console instead of as the staff member. Leave false so punishments
  # are attributed to whoever issued them; set true only if your staff don't
  # hold punishments.punish themselves.
  run-as-console: false
  # Log every punishment fired from the dialog to console.
  log-commands: true
  # Only used if DonutPunishments isn't installed or its messages.yml is
  # unreadable. Format: key|type|duration
  fallback-reasons:
    - "hacked client|ban|30d"
    - "movement mods|ban|14d"
    - "inventory mods|ban|7d"
    - "health indicators|ban|7d"
